services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${GF_DB_NAME:-gfloge}
      POSTGRES_USER: ${GF_DB_USER:-gfloge}
      POSTGRES_PASSWORD: ${GF_DB_PASSWORD:?set GF_DB_PASSWORD in .env}
    volumes:
      - gfloge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GF_DB_USER:-gfloge} -d ${GF_DB_NAME:-gfloge}"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: .
    image: ghcr.io/gfloge/gfloge:local
    init: true
    env_file: .env
    environment:
      GF_ROLE: api
      GF_HTTP_PORT: 8080   # container-internal port; the host port comes from ports
      GF_DB_HOST: db
      GF_DB_PORT: 5432
      GF_DB_NAME: ${GF_DB_NAME:-gfloge}
      GF_DB_USER: ${GF_DB_USER:-gfloge}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GF_HTTP_PORT:-8080}:8080"
    volumes:
      - gfloge-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>r.ok&&r.json().then(j=>j.ok&&j.db.ok?process.exit(0):process.exit(1))).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 4
      start_period: 30s

  worker:
    build: .
    image: ghcr.io/gfloge/gfloge:local
    init: true
    env_file: .env
    environment:
      GF_ROLE: worker
      GF_HTTP_PORT: 8080
      GF_DB_HOST: db
      GF_DB_PORT: 5432
      GF_DB_NAME: ${GF_DB_NAME:-gfloge}
      GF_DB_USER: ${GF_DB_USER:-gfloge}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - gfloge-data:/data
    healthcheck:
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  gfloge-db:
  gfloge-data:
