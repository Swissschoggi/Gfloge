<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gfloge — self-hosted personal flight tracking with a logbook at its heart." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0021" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230d0021'/%3E%3Cpath fill='%23fff' transform='rotate(45 16 16)' d='M23 18.2v-1.5l-6.2-3.9V8.6a1.3 1.3 0 0 0-2.6 0v4.2L8 16.7v1.5l6.2-1.9v3.9l-1.6 1.2v1.2l3.4-.9 3.4.9v-1.2l-1.6-1.2v-3.9z'/%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Gfloge</title>
    <script>
      // Theme before first paint: stored explicit choice wins, else system preference.
      try {
        var stored = localStorage.getItem('gfloge-theme')
        document.documentElement.dataset.theme =
          stored === 'night' || stored === 'day'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day')
      } catch (e) { /* no storage — default light */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
