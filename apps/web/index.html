<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gfloge — self-hosted personal flight tracking with a logbook at its heart." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23f4f2ec'/%3E%3Ccircle cx='12' cy='12' r='8.4' fill='none' stroke='%23171c24' stroke-width='1.6'/%3E%3Cpath d='M15.5 8.5 13 13l-4.5 2.5L11 11z' fill='none' stroke='%23e0512a' stroke-width='1.6'/%3E%3C/svg%3E" />
    <title>Gfloge</title>
    <script>
      // Theme before first paint: stored explicit choice wins, else system preference.
      try {
        var stored = localStorage.getItem('gfloge-theme')
        document.documentElement.dataset.theme =
          stored === 'night' || stored === 'day'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day')
      } catch (e) { /* no storage — default light */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
